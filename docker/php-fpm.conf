; PHP-FPM for index.php, run as the container's user (nobody), so everything it writes goes to /tmp

[global]
pid = /tmp/php-fpm.pid
error_log = /proc/self/fd/2
log_level = warning

[www]
listen = /tmp/php-fpm.sock
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
; index.php reads its settings from the environment, see README "Configuration"
clear_env = no
; Answered by FPM itself, for the health check behind /healthz
ping.path = /fpm-ping
catch_workers_output = yes
decorate_workers_output = no
