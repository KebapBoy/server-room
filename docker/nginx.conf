# nginx in front of PHP-FPM, run as the container's user (nobody), so everything it writes goes to /tmp.
# Serves only the page at / and a health check; nothing else of /app is reachable.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    server_tokens off;
    # SWAG in front logs the requests already
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        listen 8080;

        # The signed-in user comes as Remote-* headers from SWAG's authelia-location.conf.
        # Whoever reaches this port can claim to be anyone: never publish it, keep it on SWAG's network.
        location = / {
            limit_except GET {
                deny all;
            }
            fastcgi_hide_header X-Powered-By;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/index.php;
            fastcgi_param REMOTE_USER $http_remote_user;
            fastcgi_param REMOTE_NAME $http_remote_name;
            fastcgi_param REMOTE_GROUPS $http_remote_groups;
            fastcgi_pass unix:/tmp/php-fpm.sock;
        }

        location = /healthz {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_NAME /fpm-ping;
            fastcgi_param SCRIPT_FILENAME /fpm-ping;
            fastcgi_pass unix:/tmp/php-fpm.sock;
        }

        location / {
            return 404;
        }
    }
}
