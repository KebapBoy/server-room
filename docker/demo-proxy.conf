# Plays SWAG with Authelia for the demo in compose.yaml: passes the user Authelia would report
# as Remote-* headers, port 8081 the admin Alex, port 8082 the regular user Sam (as sample/router.php)
server {
    listen 8081;
    location = / {
        proxy_set_header Remote-User alex;
        proxy_set_header Remote-Name "Alex Example";
        proxy_set_header Remote-Groups admins;
        proxy_pass http://rack:8080;
    }
    location / {
        return 404;
    }
}

server {
    listen 8082;
    location = / {
        proxy_set_header Remote-User sam;
        proxy_set_header Remote-Name "Sam Example";
        proxy_set_header Remote-Groups family;
        proxy_pass http://rack:8080;
    }
    location / {
        return 404;
    }
}
