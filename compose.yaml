# Demo: the page as a container with the made-up installation from docs/sample, behind a proxy
# that plays SWAG and Authelia (just demo), at http://127.0.0.1:8081 (admin Alex) or
# http://127.0.0.1:8082 (regular user Sam); /?dry plays the sign-out. Other ports:
# DEMO_ADMIN_PORT=18081 DEMO_USER_PORT=18082 just demo
# For a real installation see deploy/compose.yaml and README, "Running as a container".
name: server-room-demo

services:
    rack:
        build: .
        image: server-room:demo
        env_file: docs/sample/env
        volumes:
            - ./docs/sample:/sample:ro
            - snapshot:/data:ro

    # Stands in for your snapshot job: docs/sample/stacks.json, kept current
    snapshot:
        image: alpine:3.24
        command: ["/sample/snapshot.sh", "/data/stacks.json"]
        volumes:
            - ./docs/sample:/sample:ro
            - snapshot:/data

    proxy:
        image: nginx:1.30-alpine
        ports:
            - 127.0.0.1:${DEMO_ADMIN_PORT:-8081}:8081
            - 127.0.0.1:${DEMO_USER_PORT:-8082}:8082
        volumes:
            - ./docker/demo-proxy.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - rack

volumes:
    snapshot:
